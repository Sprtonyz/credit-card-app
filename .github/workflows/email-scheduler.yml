name: Email scheduler

on:
  schedule:
    - cron: '7,22,37,52 10-13 * * *'
  workflow_dispatch:

concurrency:
  group: email-scheduler
  cancel-in-progress: false

jobs:
  wake-email-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out scheduler script
        uses: actions/checkout@v4

      - name: Wait for configured send time
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EMAIL_SCHEDULER_MAX_WAIT_MINUTES: '75'
          EMAIL_SCHEDULER_SEND_WINDOW_MINUTES: '15'
        run: node scripts/wait-for-email-schedule.mjs
