  <text x="922" y="582" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="600" fill="#2b2015">Ember</text>
  <text x="922" y="608" font-size="13.5" font-weight="600" letter-spacing="2.2" fill="#9a7448">FOX &#183; EMBER PALETTE (NEW)</text>
  <g font-size="14.5" fill="#6a543e">
