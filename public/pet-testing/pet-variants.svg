    <ellipse cx="-31" cy="-26" rx="9" ry="5.5" fill="#ffb08f" opacity="0.6"/>
    <ellipse cx="31" cy="-26" rx="9" ry="5.5" fill="#ffb08f" opacity="0.6"/>
