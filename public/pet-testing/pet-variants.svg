    <rect x="68" y="0" width="26" height="26" rx="7" fill="#7f98b0" stroke="#415869" stroke-width="1.5"/>
    <rect x="102" y="0" width="26" height="26" rx="7" fill="#415869" stroke="#415869" stroke-width="1.5"/>
