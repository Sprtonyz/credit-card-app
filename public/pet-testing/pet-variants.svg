  <text x="60" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="600" fill="#2b2015">Pet Variant Concepts</text>
  <text x="1220" y="94" text-anchor="end" font-size="14" fill="#7d6446">static poses &#183; no animation required</text>
  <line x1="60" y1="112" x2="1220" y2="112" stroke="#d9c3a5" stroke-width="1.5"/>

  <!-- ============ CARD 1: MAPLE / CAT ============ -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="140" width="560" height="330" rx="26" fill="url(#cardBg)" stroke="#dcc7af" stroke-width="1.5"/>
  </g>
  <g transform="translate(200,320)">
